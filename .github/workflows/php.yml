name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.2'
    - name: Run install-dependencies.sh
      run: bash installscript/install-dependencies.sh
    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    # Vor dem Install und auf composer.json geschluesselt: composer.lock ist in
    # diesem Repo gitignored, ein Schluessel auf '**/composer.lock' greift daher
    # ins Leere und der restore-key haengt jedem Lauf denselben alten vendor-Baum
    # an. Stand der Cache hinter dem Install, ueberschrieb er den frisch
    # aufgeloesten vendor/composer-Stand wieder mit dem alten - neue Pakete waren
    # fuer Autoloader und PHPStan unsichtbar.
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-8.2-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    # Bricht bei bekannten Sicherheitsluecken in den Laufzeit-Abhaengigkeiten
    # ab; aufgegebene Pakete werden nur gemeldet. require-dev laeuft nur hier
    # und lokal, dessen Aktualisierung kommt ueber Dependabot.
    - name: Audit dependencies
      run: composer audit --no-dev --abandoned=report

    - name: Dump Autoload
      run: composer dump-autoload -o

    - name: Copy phpunit.xml
      run: php -r "file_exists('phpunit.xml') || copy('phpunit.xml.dist', 'phpunit.xml');"

    - name: Check code style (Pint)
      run: composer run-script format

    - name: Static analysis (PHPStan)
      run: composer run-script lint

    # install-dependencies.sh installiert nur die Pflichtwerkzeuge; mutool und
    # ImageMagick sind optional und fehlten bisher waehrend der Hauptsuite - die
    # Raster-, Seiten-, Schutz- und Metadaten-Tests (37) sowie die Tests mit
    # bildlastigen PDFs (4) uebersprangen still. Beide hier vor der Suite
    # nachziehen. Ubuntu liefert ImageMagick 6, dessen policy.xml das Schreiben
    # von PDF sperren kann; die Testhilfe PdfProbe::imageHeavy baut ihre PDF mit
    # convert, deshalb die PDF-Zeile freischalten, falls vorhanden.
    - name: Systemwerkzeuge fuer die Tests sicherstellen
      run: |
        missing=()
        command -v mutool >/dev/null || missing+=(mupdf-tools)
        command -v convert >/dev/null || missing+=(imagemagick)
        if ((${#missing[@]})); then
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${missing[@]}"
        fi
        for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
          [[ -f "$policy" ]] && sudo sed -i -E 's/rights="none" (pattern="PDF")/rights="read|write" \1/' "$policy"
        done
        echo "mutool: $(mutool -v 2>&1 | head -1)"; echo "convert: $(convert -version | head -1)"
        # PDF/A-Pruefer kommen ueber install-dependencies.sh (install-Objekte); ohne sie
        # ueberspraenge PDFAComplianceHelperTest den Lauf gegen echte Dateien.
        echo "verapdf: $(verapdf --version 2>&1 | head -1)"; echo "pdfcraft-cli: $(pdfcraft-cli --version 2>&1 | head -1)"

    - name: Run test suite
      run: composer run-script test

    # Die MuPDF-Skripte unter data/mupdf laufen auf dem Server mit einer
    # aelteren Version als hier (ADR-0034 E5): 1.17 und 1.21 aus dem
    # Debian-Pool davorstellen und die betroffenen Tests wiederholen.
    # scripts/ci/mupdf-alt.sh prueft feste SHA-256-Summen.
    - name: Cache aeltere MuPDF-Versionen
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .mupdf-alt/deb
        key: mupdf-alt-${{ hashFiles('scripts/ci/mupdf-alt.sh') }}

    - name: Aeltere MuPDF-Versionen bereitstellen
      run: bash scripts/ci/mupdf-alt.sh "$PWD/.mupdf-alt"

    - name: Tests gegen MuPDF 1.17 und 1.21
      run: |
        for version in 1.17.0 1.21.1; do
          echo "== MuPDF $version"
          PATH="$PWD/.mupdf-alt/bin-$version:$PATH" vendor/bin/phpunit \
            tests/Helper/PDFCropHelperGridTest.php \
            tests/Helper/PDFPageHelperTest.php \
            tests/Helper/PDFSecurityHelperTest.php \
            tests/Helper/PDFMetadataHelperTest.php \
            tests/Helper/PDFOptimizeHelperTest.php
        done
