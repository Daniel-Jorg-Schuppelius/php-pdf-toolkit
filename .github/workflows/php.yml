name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Run install-dependencies.sh
      run: bash installscript/install-dependencies.sh
    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    # Vor dem Install und auf composer.json geschluesselt: composer.lock ist in
    # diesem Repo gitignored, ein Schluessel auf '**/composer.lock' greift daher
    # ins Leere und der restore-key haengt jedem Lauf denselben alten vendor-Baum
    # an. Stand der Cache hinter dem Install, ueberschrieb er den frisch
    # aufgeloesten vendor/composer-Stand wieder mit dem alten - neue Pakete waren
    # fuer Autoloader und PHPStan unsichtbar.
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-8.2-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Dump Autoload
      run: composer dump-autoload -o

    - name: Copy phpunit.xml
      run: php -r "file_exists('phpunit.xml') || copy('phpunit.xml.dist', 'phpunit.xml');"

    - name: Check code style (Pint)
      run: composer run-script format

    - name: Static analysis (PHPStan)
      run: composer run-script lint

    - name: Run test suite
      run: composer run-script test
